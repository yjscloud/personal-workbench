name: feishu-bot-platform
label: Feishu Bot
kind: platform
version: 1.1.0
description: >
  飞书出站投递。优先用应用机器人（app_id/app_secret/chat_id，能指定群），
  没有则回落到自定义机器人 webhook（open-apis/bot/v2/hook）。
  只发不收 —— 接收消息与卡片按钮由个人工作台的长连接负责。
author: personal-workbench
optional_env:
  - name: FEISHU_APP_ID
    description: "飞书应用机器人 App ID（cli_ 开头）。填了下面两项就优先走应用机器人"
    prompt: "Feishu app id (optional)"
    password: false
  - name: FEISHU_APP_SECRET
    description: "飞书应用机器人 App Secret（可选，配合 App ID 使用）"
    prompt: "Feishu app secret (optional)"
    password: true
  - name: FEISHU_CHAT_ID
    description: "目标群会话 id（oc_ 开头）。应用机器人模式下消息发到这个群"
    prompt: "Feishu chat id (optional)"
    password: false
  - name: FEISHU_BOT_WEBHOOK_URL
    description: "飞书自定义机器人 webhook 地址（https://open.feishu.cn/open-apis/bot/v2/hook/...），应用机器人不可用时回落到这条"
    prompt: "飞书机器人 webhook"
    password: false
  - name: FEISHU_BOT_HOME_CHANNEL
    description: "cron deliver=feishu_bot 时使用的目标标识（webhook 模式只需非空，默认 feishu-bot）"
    prompt: "Home channel id (optional)"
    password: false
  - name: FEISHU_BOT_SECRET
    description: "机器人开启签名校验时的 secret（可选）"
    prompt: "Feishu bot sign secret (optional)"
    password: true
